# qwen3-32b served from the public catalog on 2×L40S: 32 K context, 32 sequences,
# 5 GiB of KV cache per GPU, full and piecewise CUDA graphs up to batch 32.
schema: warmctl.profile/v1
id: qwen3-32b-l40s-tp2
model: {id: Qwen/Qwen3-32B, revision: 9216db5781bf21249d130ec9da846c4624c16137, served_names: [qwen32]}
parallel: {tp: 2}
hardware: [l40s-48gb]
vllm:
  max-model-len: 32768
  max-num-seqs: 32
  max-num-batched-tokens: 8192
  kv-cache-memory-bytes: 5368709120
  enable-chunked-prefill: true
  disable-custom-all-reduce: null
graphs:
  mode: FULL_AND_PIECEWISE
  decode_batches: [1, 2, 4, 8, 16, 24, 32]
warmup:
  decode_prompt_tokens: 32
  prefill_tokens: [512, 2048, 8192]
resources: {memory: 160GiB}

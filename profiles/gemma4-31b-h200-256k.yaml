# gemma4-31b on 1×H200, serving release (dense BF16, the full-precision checkpoint): the
# full native 262 144 context, 64 sequences, 60 GiB of KV cache. Only the 10 global layers
# keep the whole context (K = V, 4 heads × 512); the 50 sliding layers keep 1 024 tokens,
# so 60 GiB holds ~6 full-length sequences next to 58 GiB of weights. gemma4 reasoning and
# tool-call parsers; sampling from generation_config.json (T 1.0, top-p 0.95, top-k 64),
# the card's values. The assistant drafter is not in this vLLM build.
schema: warmctl.profile/v1
id: gemma4-31b-h200-256k
model: {id: google/gemma-4-31B-it, revision: 842da3794eaa0b77d5f08bae87a17459d91ff475, served_names: [gemma4-31b]}
parallel: {tp: 1}
hardware: [h200-141gb]
vllm:
  max-model-len: 262144
  max-num-seqs: 64
  max-num-batched-tokens: 8192
  kv-cache-memory-bytes: 64424509440
  enable-chunked-prefill: true
  limit-mm-per-prompt: {image: 0, video: 0}
  reasoning-parser: gemma4
  enable-auto-tool-choice: true
  tool-call-parser: gemma4
graphs:
  mode: FULL_AND_PIECEWISE
  decode_batches: [1, 2, 4, 8, 16, 24, 32, 48, 64]
warmup:
  decode_prompt_tokens: 32
  prefill_tokens: [512, 2048, 8192]
resources: {memory: 160GiB}

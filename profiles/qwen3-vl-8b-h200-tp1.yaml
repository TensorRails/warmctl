# qwen3-vl-8b served from the public catalog on 1×H200 (vision on: up to 4 images a prompt): 64 K context,
# 64 sequences, 96 GiB of KV cache, full and piecewise CUDA graphs up to batch 64.
schema: warmctl.profile/v1
id: qwen3-vl-8b-h200-tp1
model: {id: Qwen/Qwen3-VL-8B-Instruct, revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b, served_names: [qwen3-vl-8b]}
parallel: {tp: 1}
hardware: [h200-141gb]
vllm:
  max-model-len: 65536
  max-num-seqs: 64
  max-num-batched-tokens: 8192
  kv-cache-memory-bytes: 103079215104
  enable-chunked-prefill: true
  limit-mm-per-prompt: {image: 4, video: 0}
graphs:
  mode: FULL_AND_PIECEWISE
  decode_batches: [1, 2, 4, 8, 16, 24, 32, 48, 64]
warmup:
  decode_prompt_tokens: 32
  prefill_tokens: [512, 2048, 8192]
resources: {memory: 160GiB}

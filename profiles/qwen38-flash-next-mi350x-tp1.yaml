# qwen38-flash-next on one AMD Instinct MI350X: Qwen's FP8 release of the
# 180B-A6B hybrid MoE on one GPU (288 GB: 173 GiB of weights with the PLE
# n-gram table, which stays on the GPU as part of the weights pool, and 64 GiB
# of KV cache, BF16: the model's QSA attention on ROCm takes BF16 or Octave,
# not FP8). MTP with 3 draft tokens and the qwen3 / qwen3_coder parsers per
# the vLLM recipe. Needs a ROCm vLLM that knows the model (0.33.0+rocm100).
schema: warmctl.profile/v1
id: qwen38-flash-next-mi350x-tp1
model: {id: Qwen/Qwen3.8-Flash-Next-FP8, revision: 236dfdf285828023ca3bcd3f37366c58a3469b13, served_names: [qwen38-flash-next]}
parallel: {tp: 1}
hardware: [mi350x-288gb, mi355x-288gb]
vllm:
  max-model-len: 262144
  max-num-seqs: 32
  max-num-batched-tokens: 8192
  kv-cache-memory-bytes: 68719476736
  enable-chunked-prefill: true
  enable-prefix-caching: true
  limit-mm-per-prompt: {image: 0, video: 0}
  mamba-cache-mode: align
  engram-config: {cpu_offload: false, dp_shared_memory: false, use_thp: false}
  speculative-config: {method: mtp, num_speculative_tokens: 3}
  reasoning-parser: qwen3
  enable-auto-tool-choice: true
  tool-call-parser: qwen3_coder
graphs:
  mode: FULL_AND_PIECEWISE
  decode_batches: [1, 2, 4, 8, 16, 24, 32]
warmup:
  decode_prompt_tokens: 32
  prefill_tokens: [512, 2048, 8192]
# MTP and MoE kernels are not bitwise repeatable: compare within a tolerance.
canary: {mode: warn, tolerance: 1.0e-3}
resources: {memory: 256GiB}

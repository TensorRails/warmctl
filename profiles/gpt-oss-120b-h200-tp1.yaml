# gpt-oss-120b served from the public catalog on 1×H200: 128 K context, 64 sequences,
# 48 GiB of KV cache, full and piecewise CUDA graphs up to batch 64.
schema: warmctl.profile/v1
id: gpt-oss-120b-h200-tp1
model: {id: openai/gpt-oss-120b, revision: b5c939de8f754692c1647ca79fbf85e8c1e70f8a, served_names: [gpt-oss-120b]}
parallel: {tp: 1}
hardware: [h200-141gb]
vllm:
  max-model-len: 131072
  max-num-seqs: 64
  max-num-batched-tokens: 8192
  kv-cache-memory-bytes: 51539607552
  enable-chunked-prefill: true
graphs:
  mode: FULL_AND_PIECEWISE
  decode_batches: [1, 2, 4, 8, 16, 24, 32, 48, 64]
warmup:
  decode_prompt_tokens: 32
  prefill_tokens: [512, 2048, 8192]
resources: {memory: 160GiB}

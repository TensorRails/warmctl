# qwen3-32b from the public catalog on 2×H100: 32 K context, 64 sequences, 28 GiB of KV
# cache per GPU, custom all-reduce.
schema: warmctl.profile/v1
id: qwen3-32b-h100-tp2
model: {id: Qwen/Qwen3-32B, revision: 9216db5781bf21249d130ec9da846c4624c16137, served_names: [qwen32]}
parallel: {tp: 2}
hardware: [h100-80gb-sxm]
vllm:
  max-model-len: 32768
  max-num-seqs: 64
  max-num-batched-tokens: 8192
  kv-cache-memory-bytes: 30064771072
  enable-chunked-prefill: true
  disable-custom-all-reduce: null
graphs:
  mode: FULL_AND_PIECEWISE
  decode_batches: [1, 2, 4, 8, 16, 24, 32, 48, 64]
warmup:
  decode_prompt_tokens: 32
  prefill_tokens: [512, 2048, 8192]
resources: {memory: 160GiB}

# qwen3-vl-8b served from the public catalog on 1×B200 (vision on: up to 4 images a prompt): 64 K context,
# 128 sequences, 128 GiB of KV cache, full and piecewise CUDA graphs up to batch 128.
schema: warmctl.profile/v1
id: qwen3-vl-8b-b200-tp1
model: {id: Qwen/Qwen3-VL-8B-Instruct, revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b, served_names: [qwen3-vl-8b]}
parallel: {tp: 1}
hardware: [b200-180gb]
vllm:
  max-model-len: 65536
  max-num-seqs: 128
  max-num-batched-tokens: 8192
  kv-cache-memory-bytes: 137438953472
  enable-chunked-prefill: true
  limit-mm-per-prompt: {image: 4, video: 0}
graphs:
  mode: FULL_AND_PIECEWISE
  decode_batches: [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128]
warmup:
  decode_prompt_tokens: 32
  prefill_tokens: [512, 2048, 8192]
resources: {memory: 160GiB}

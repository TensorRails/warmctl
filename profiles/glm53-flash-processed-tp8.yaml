# GLM-5.3-Flash, the test layout: 2560-token context, FP8, the 64-token
# prefill grid on top of the generic decode grid.
schema: warmctl.profile/v1
id: glm53-flash-processed-tp8
model: {id: zai-org/GLM-5.3-Flash, revision: eb9eb208eb0d988989d07a6a12d0fdeb5f52574a, served_names: [glm53-flash]}
parallel: {tp: 8}
hardware: [h100-80gb-sxm]
vllm:
  max-model-len: 2560
  max-num-batched-tokens: 2560
  quantization: fp8
  # The pinned vLLM accepts none/align; align is its prefix-caching mode.
  mamba-cache-mode: align
  limit-mm-per-prompt: {image: 0, video: 0}
env:
  DG_JIT_CACHE_DIR: /workspace/deep_gemm
warmup:
  prefill_tokens: [{from: 64, to: 2496, step: 64}, 2528]
  mixed: [{prompt_tokens: [32, 128, 512], batches: [1, 2, 4, 8]}]
canary: {mode: bitwise, prefix_tokens: 1280}
resources: {memory: 1TiB}

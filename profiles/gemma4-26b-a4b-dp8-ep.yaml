# Eight engine replicas of TP1, expert-parallel MoE over allgather and
# reducescatter: the one all-to-all backend whose buffers ride the suspended
# NCCL communicators. Each replica holds all of attention and 1/8 of the
# experts, so more host memory than one TP8 engine.
schema: warmctl.profile/v1
id: gemma4-26b-a4b-dp8-ep
model: {id: google/gemma-4-26B-A4B-it, revision: 4d7ae4984b7db7de8f8457170b3f1a419ee76d52, served_names: [gemma4-26b-a4b]}
parallel: {tp: 1, dp: 8, ep: true}
hardware: [h100-80gb-sxm]
vllm:
  all2all-backend: allgather_reducescatter
  limit-mm-per-prompt: {image: 0, video: 0}
  disable-custom-all-reduce: null
graphs: {fuse_allreduce_rms: true}
env:
  VLLM_ALLREDUCE_USE_FLASHINFER: "1"
  VLLM_ALLREDUCE_USE_SYMM_MEM: "1"
resources: {memory: 256GiB}

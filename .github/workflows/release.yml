name: release

# A v* tag publishes a GitHub release (RELEASING.md): archives for linux and
# macOS, checksums signed with cosign, SBOMs and build provenance. A pull
# request touching the release builds the same archives as a snapshot.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - scripts/release-notes.sh
      - Makefile

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GORELEASER_VERSION: v2.18.2
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: v1.52.0

jobs:
  cuinterpose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make cuinterpose
      # A tar keeps the executable bits an artifact upload would drop.
      - run: tar -cf cuinterpose-linux-amd64.tar -C bin cuinterpose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuinterpose-linux-amd64
          path: cuinterpose-linux-amd64.tar
          if-no-files-found: error

  release:
    needs: cuinterpose
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and its assets
      id-token: write # keyless cosign signature and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuinterpose-linux-amd64
      - run: mkdir -p bin && tar -xf cuinterpose-linux-amd64.tar -C bin && ls -l bin/cuinterpose
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # A snapshot checks the script on the newest released section.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0-beta.5' }}
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/warmctl-${{ github.ref_name }}-checksums.txt

      - name: Snapshot
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
      - name: Check the snapshot archives
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          ls -l dist/*.tar.gz
          tar -tzf dist/warmctl-*-linux-amd64.tar.gz | sort
          tar -xzf dist/warmctl-*-linux-amd64.tar.gz -C "$RUNNER_TEMP" warmctl cuinterpose/libcuinterpose.so
          "$RUNNER_TEMP/warmctl" version
          test -x "$RUNNER_TEMP/warmctl"
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*checksums.txt
          retention-days: 7

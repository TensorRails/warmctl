name: release

# A v* tag publishes a GitHub release (RELEASING.md): archives for linux and
# macOS, checksums signed with cosign, SBOMs and build provenance. A pull
# request touching the release builds the same archives as a snapshot.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - scripts/release-notes.sh
      - scripts/fetch-dmtcp.sh
      - scripts/install.sh
      - scripts/test-install.py
      - internal/dmtcp/**
      - Makefile

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GORELEASER_VERSION: v2.18.2
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: v1.52.0

jobs:
  cuinterpose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make cuinterpose
      # A tar keeps the executable bits an artifact upload would drop.
      - run: tar -cf cuinterpose-linux-amd64.tar -C bin cuinterpose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuinterpose-linux-amd64
          path: cuinterpose-linux-amd64.tar
          if-no-files-found: error

  release:
    needs: cuinterpose
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and its assets
      id-token: write # keyless cosign signature and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # Outside the checkout: goreleaser refuses a tree with untracked files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuinterpose-linux-amd64
          path: ${{ runner.temp }}
      - run: mkdir -p bin && tar -xf "$RUNNER_TEMP/cuinterpose-linux-amd64.tar" -C bin && ls -l bin/cuinterpose
      - name: Fetch the pinned DMTCP release packages
        run: |
          version=$(cat internal/dmtcp/VERSION)
          scripts/fetch-dmtcp.sh amd64 "dmtcp/linux-amd64/$version"
          scripts/fetch-dmtcp.sh arm64 "dmtcp/linux-arm64/$version"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # A snapshot checks the script on the newest released section.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0-beta.5' }}
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Build signed release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/warmctl-${{ github.ref_name }}-checksums.txt

      - name: Snapshot
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
      - name: Check the snapshot archives
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          ls -l dist/*.tar.gz
          tar -tzf dist/warmctl-*-linux-amd64.tar.gz | sort
          tar -xzf dist/warmctl-*-linux-amd64.tar.gz -C "$RUNNER_TEMP" warmctl cuinterpose/libcuinterpose.so
          "$RUNNER_TEMP/warmctl" version
          test -x "$RUNNER_TEMP/warmctl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/*.tar.gz
            dist/*checksums.txt
            dist/*.sigstore.json
            dist/*.sbom.json
          retention-days: 7

  verify-native:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - name: Check the actual native archive and plugin
        run: |
          mkdir unpacked
          tar -xzf packages/*-linux-${{ matrix.arch }}.tar.gz -C unpacked
          unpacked/warmctl version
          version=$(cat internal/dmtcp/VERSION)
          root="$PWD/unpacked/dmtcp/linux-${{ matrix.arch }}/$version"
          "$root/bin/dmtcp_launch" --version
          "$root/bin/dmtcp_coordinator" --daemon --exit-on-last --port 0 --port-file "$RUNNER_TEMP/dmtcp.port"
          port=$(cat "$RUNNER_TEMP/dmtcp.port")
          trap '"$root/bin/dmtcp_command" --coord-port "$port" --quit || true' EXIT
          DMTCP_PLUGIN="$root/lib/libdmtcp_fdkeep.so" "$root/bin/dmtcp_launch" --join-coordinator --coord-port "$port" /bin/true
      - name: Checkpoint and restore with the packaged runtime on Ubuntu 24.04
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat internal/dmtcp/VERSION)
          mkdir "$RUNNER_TEMP/dmtcp-source"
          gh release download "$version" --repo TensorRails/dmtcp --pattern "dmtcp-$version-source.tar.gz" --dir "$RUNNER_TEMP/dmtcp-source"
          (cd "$RUNNER_TEMP/dmtcp-source" && sha256sum --ignore-missing -c "$GITHUB_WORKSPACE/internal/dmtcp/SHA256SUMS")
          tar -xzf "$RUNNER_TEMP/dmtcp-source/dmtcp-$version-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/dmtcp-source"
          root="$PWD/unpacked/dmtcp/linux-${{ matrix.arch }}/$version"
          python3 "$RUNNER_TEMP/dmtcp-source/test/restore-memory-check.py" --root "$root" \
            --plugin "$root/lib/libdmtcp_fdkeep.so" --output "$RUNNER_TEMP/dmtcp-installed-check"
      - name: Install, reinstall, preserve old snapshots and refuse replacement
        run: INSTALL_TEST_ARCHIVE=$(echo "$PWD"/packages/*-linux-${{ matrix.arch }}.tar.gz) python3 scripts/test-install.py

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" packages/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

name: runtime image

# CUDA publication uses a released CLI. ROCm stages a candidate from the
# dispatched ref, with the same version that its release preparation declares.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Published warmctl release tag (CUDA runtime)
        required: false
      rocm_verify_only:
        description: Build and smoke-test ROCm images only in the temporary runner
        type: boolean
        default: false
      rocm_candidate_tag:
        description: Build the ROCm 0.33 base and runtime from the selected ref under this staging-* tag
        required: false
      rocm_base_only:
        description: Build and publish only the staged vLLM ROCm base
        type: boolean
        default: false
      image_tag:
        description: Optional image tag (defaults to the release tag)
        required: false
      base:
        description: Optional pinned CUDA base, or the prior vllm-rocm@sha256 digest for a ROCm candidate
        required: false

permissions:
  contents: read
  attestations: read

concurrency:
  group: runtime-image-${{ inputs.rocm_candidate_tag || inputs.image_tag || inputs.release || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !inputs.rocm_verify_only && inputs.rocm_candidate_tag == '' && !inputs.rocm_base_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}
      IMAGE_TAG: ${{ inputs.image_tag || inputs.release }}
      BASE_IMAGE: ${{ inputs.base }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          persist-credentials: false
      - name: Validate release and image tag
        run: |
          [[ "$RELEASE" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]
          gh release view "$RELEASE" --repo TensorRails/warmctl
          if [ -n "$BASE_IMAGE" ]; then [[ "$BASE_IMAGE" == *@sha256:* ]]; fi
      - name: Make room for the vLLM image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Fetch and verify the released cuInterpose bundle
        run: |
          mkdir -p "$RUNNER_TEMP/release" bin
          gh release download "$RELEASE" --repo TensorRails/warmctl --dir "$RUNNER_TEMP/release" \
            --pattern "warmctl-$RELEASE-linux-amd64.tar.gz" --pattern "warmctl-$RELEASE-checksums.txt"
          (cd "$RUNNER_TEMP/release" && sha256sum --ignore-missing -c "warmctl-$RELEASE-checksums.txt")
          gh attestation verify "$RUNNER_TEMP/release/warmctl-$RELEASE-linux-amd64.tar.gz" --repo TensorRails/warmctl
          tar -xzf "$RUNNER_TEMP/release/warmctl-$RELEASE-linux-amd64.tar.gz" -C bin cuinterpose
      - name: Build the released runtime
        run: |
          # beta.17's Docker context omitted this newly added package fetcher.
          # Keep the tag immutable; repair only context and system dependencies.
          if [ "$RELEASE" = v2.0.0-beta.17 ]; then
            printf '\n!scripts/fetch-dmtcp.sh\n' >> deploy/kubernetes/Dockerfile.dockerignore
            sed -i 's/ libstdc++6/ libstdc++6 libatomic1/g' deploy/kubernetes/Dockerfile
          fi
          args=()
          if [ -n "$BASE_IMAGE" ]; then args+=(--build-arg "BASE=$BASE_IMAGE"); fi
          docker build -t "localhost:5000/warmctl/runtime:$IMAGE_TAG" \
            -f deploy/kubernetes/Dockerfile --build-context cuinterpose=bin/cuinterpose \
            --build-arg "VERSION=$RELEASE" "${args[@]}" .
      - name: Verify runtime programs and native plugin
        run: |
          docker run --rm --entrypoint /usr/local/bin/tini "localhost:5000/warmctl/runtime:$IMAGE_TAG" -- /bin/bash -lc '
            set -e
            warmctl version
            cat /opt/warmctl/RUNTIME /opt/warmctl/dmtcp/BUILDINFO
            python3 -c "import importlib.metadata as m; print(\"vllm\", m.version(\"vllm\"))"
            root=/opt/warmctl/dmtcp
            "$root/bin/dmtcp_coordinator" --daemon --exit-on-last --port 0 --port-file /tmp/dmtcp.port
            port=$(cat /tmp/dmtcp.port)
            DMTCP_PLUGIN="$root/lib/libdmtcp_fdkeep.so" "$root/bin/dmtcp_launch" --join-coordinator --coord-port "$port" /bin/true
          '
      - name: Install the pinned registry client
        run: |
          curl -fsSL --retry 3 https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64 -o "$RUNNER_TEMP/regctl"
          echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  $RUNNER_TEMP/regctl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/regctl"
      - name: Publish with bounded registry chunks
        env:
          WARMCTL_REGISTRY_AUTH: ${{ secrets.WARMCTL_REGISTRY_AUTH }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(os.environ['WARMCTL_REGISTRY_AUTH'])
          assert set(config['auths']) == {'registry.warmctl.io'}
          path = Path.home() / '.docker/config.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          path.chmod(0o600)
          PY
          docker run -d --name release-registry -p 127.0.0.1:5000:5000 registry:2
          docker push "localhost:5000/warmctl/runtime:$IMAGE_TAG"
          "$RUNNER_TEMP/regctl" registry set localhost:5000 --tls disabled
          "$RUNNER_TEMP/regctl" registry set registry.warmctl.io --blob-chunk 67108864 --blob-max 67108864
          "$RUNNER_TEMP/regctl" image copy "localhost:5000/warmctl/runtime:$IMAGE_TAG" "registry.warmctl.io/warmctl/runtime:$IMAGE_TAG"
          digest=$("$RUNNER_TEMP/regctl" image digest "registry.warmctl.io/warmctl/runtime:$IMAGE_TAG")
          printf 'registry.warmctl.io/warmctl/runtime:%s@%s\n' "$IMAGE_TAG" "$digest" | tee runtime-image.txt
          cat runtime-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-image
          path: runtime-image.txt
          if-no-files-found: error
      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.docker/config.json"

  rocm-candidate:
    if: ${{ !inputs.rocm_verify_only && (inputs.rocm_candidate_tag != '' || inputs.rocm_base_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STAGING_TAG: ${{ inputs.rocm_candidate_tag }}
      PUBLIC: registry.warmctl.io/warmctl
      LOCAL: localhost:5000/warmctl
    steps:
      - name: Validate ROCm staging inputs
        env:
          CUDA_INPUTS: ${{ inputs.release || inputs.image_tag }}
          REUSE_BASE: ${{ inputs.base }}
          BASE_ONLY: ${{ inputs.rocm_base_only }}
        run: |
          [[ "$STAGING_TAG" =~ ^staging-[a-z0-9][a-z0-9_.-]{0,119}$ && -z "$CUDA_INPUTS" ]]
          if [[ -n "$REUSE_BASE" ]]; then
            [[ "$BASE_ONLY" == false && "$REUSE_BASE" =~ ^registry\.warmctl\.io/warmctl/vllm-rocm@sha256:[0-9a-f]{64}$ ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the Linux/amd64 builder and local registry
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
          curl -fsSL --retry 3 https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64 -o "$RUNNER_TEMP/regctl"
          echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  $RUNNER_TEMP/regctl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          docker run -d --name staging-registry -p 127.0.0.1:5000:5000 registry:2
          "$RUNNER_TEMP/regctl" registry set localhost:5000 --tls disabled
      - name: Configure access to the staging registry
        env:
          WARMCTL_REGISTRY_AUTH: ${{ secrets.WARMCTL_REGISTRY_AUTH }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/staging-auth"
          umask 077
          jq -ec 'select((.auths | keys) == ["registry.warmctl.io"])' <<< "$WARMCTL_REGISTRY_AUTH" > "$RUNNER_TEMP/staging-auth/config.json"
          regctl registry set registry.warmctl.io --blob-chunk 67108864 --blob-max 67108864
      - name: Build or fetch the pinned base and verify its content
        env:
          REUSE_BASE: ${{ inputs.base }}
        run: |
          base="$LOCAL/vllm-rocm:$STAGING_TAG"
          recipe=$(cat deploy/images/vllm-rocm-0.33/{Dockerfile,requirements.lock} | sha256sum | cut -d' ' -f1)
          if [[ -z "$REUSE_BASE" ]]; then
            docker build --platform linux/amd64 --label "io.warmctl.base-recipe=$recipe" -t "$base" deploy/images/vllm-rocm-0.33
            docker push "$base"
          else
            DOCKER_CONFIG="$RUNNER_TEMP/staging-auth" regctl image copy "$REUSE_BASE" "$base"
          fi
          digest=$(regctl image digest "$base")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          base_ref="$PUBLIC/vllm-rocm@$digest"
          [[ -z "$REUSE_BASE" || "$REUSE_BASE" == "$base_ref" ]]
          docker pull "$base@$digest"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.warmctl.base-recipe" }}' "$base@$digest")" = "$recipe"
          lock=$(sha256sum deploy/images/vllm-rocm-0.33/requirements.lock | cut -d' ' -f1)
          docker run --rm --entrypoint /bin/bash -e "LOCK=$lock" "$base@$digest" -ec '
            echo "$LOCK  /opt/vllm-rocm/requirements.lock" | sha256sum -c -
            python -c "import torch, torchvision, vllm; from importlib.metadata import version; assert version(\"vllm\") == \"0.33.0+rocm100\" and version(\"torch\") == \"2.13.0+rocm10.0.0\" and torch.version.hip"
          '
          echo "BASE_REF=$base_ref" >> "$GITHUB_ENV"
      - name: Build the runtime, check its release version, DMTCP and libkfdreplay
        if: '!inputs.rocm_base_only'
        run: |
          version=$(awk '$1 == "##" { print $2; exit }' CHANGELOG.md)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          scripts/release-notes.sh "$version" > /dev/null
          pin=$(cat internal/kfdreplay/VERSION)
          base="$LOCAL/vllm-rocm:$STAGING_TAG@${BASE_REF##*@}"
          runtime="$LOCAL/runtime-rocm:$STAGING_TAG"
          docker build --platform linux/amd64 -t "$runtime" -f deploy/rocm/Dockerfile \
            --build-arg "BASE=$base" --build-arg "BASE_REF=$BASE_REF" --build-arg "VERSION=$version" .
          docker run --rm --entrypoint /usr/local/bin/tini -e BASE_REF -e "VERSION=$version" -e "PIN=$pin" "$runtime" -- /bin/bash -ec '
            test "$(warmctl version)" = "warmctl $VERSION"
            grep -Fx "base=$BASE_REF" /opt/warmctl/RUNTIME
            grep -Fx "warmctl=$VERSION" /opt/warmctl/RUNTIME
            export KFDR_LIB="/opt/warmctl/kfdreplay/$PIN/libkfdreplay.so"
            python -c "import ctypes as c, os; f=c.CDLL(os.environ[\"KFDR_LIB\"]).kfdr_version; f.restype=c.c_char_p; assert f().decode() == os.environ[\"PIN\"][1:]"
            root=/opt/warmctl/dmtcp
            "$root/bin/dmtcp_coordinator" --daemon --exit-on-last --port 0 --port-file /tmp/dmtcp.port
            LD_PRELOAD="$KFDR_LIB" DMTCP_PLUGIN="$root/lib/libdmtcp_fdkeep.so" "$root/bin/dmtcp_launch" --join-coordinator --coord-port "$(cat /tmp/dmtcp.port)" /bin/true
          '
          docker push "$runtime"
          printf 'version=%s\nlibkfdreplay=%s\n' "$version" "$pin" >> rocm-candidate.txt
      - name: Publish checked images to staging and verify the remote digests
        env:
          BASE_ONLY: ${{ inputs.rocm_base_only }}
          REUSE_BASE: ${{ inputs.base }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/staging-auth"
          printf 'source=%s\nbase=%s\n' "$GITHUB_SHA" "$BASE_REF" >> rocm-candidate.txt
          images=()
          if [[ -z "$REUSE_BASE" ]]; then images+=(vllm-rocm); fi
          if [[ "$BASE_ONLY" != true ]]; then images+=(runtime-rocm); fi
          for image in "${images[@]}"; do
            from="$LOCAL/$image:$STAGING_TAG"
            to="$PUBLIC/$image:$STAGING_TAG"
            digest=$(regctl image digest "$from")
            if current=$(regctl image digest "$to" 2>"$RUNNER_TEMP/tag-lookup"); then
              [[ "$current" == "$digest" ]] || { echo "Staging tag $to already names another digest" >&2; exit 1; }
            else
              grep -Eiq '404|manifest unknown|not found' "$RUNNER_TEMP/tag-lookup" || { cat "$RUNNER_TEMP/tag-lookup" >&2; exit 1; }
              regctl image copy "$from" "$to"
            fi
            test "$digest" = "$(regctl image digest "$to")"
            printf '%s@%s\n' "$to" "$digest" >> rocm-candidate.txt
          done
          cat rocm-candidate.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-candidate
          path: rocm-candidate.txt
          if-no-files-found: error
      - name: Remove staging credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/staging-auth/config.json"

  rocm-verify:
    if: inputs.rocm_verify_only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Reject publication inputs in verify-only mode
        env:
          PUBLICATION_INPUT: ${{ inputs.release != '' || inputs.image_tag != '' || inputs.base != '' || inputs.rocm_candidate_tag != '' || inputs.rocm_base_only }}
        run: test "$PUBLICATION_INPUT" = false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the locked Linux/amd64 vLLM base locally
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
          docker build --platform linux/amd64 -t warmctl-vllm-rocm:verify deploy/images/vllm-rocm-0.33
      - name: Build and check the complete local ROCm runtime
        run: |
          base=$(docker image inspect --format '{{.Id}}' warmctl-vllm-rocm:verify)
          version=$(awk '$1 == "##" { print $2; exit }' CHANGELOG.md)
          if [[ "$version" == Unreleased ]]; then version="dev-${GITHUB_SHA:0:12}"; fi
          pin=$(cat internal/kfdreplay/VERSION)
          docker build --platform linux/amd64 -f deploy/rocm/Dockerfile -t warmctl-runtime-rocm:verify \
            --build-arg BASE=warmctl-vllm-rocm:verify --build-arg "BASE_REF=$base" --build-arg "VERSION=$version" .
          echo "source=$GITHUB_SHA, warmctl=$version, libkfdreplay=$pin, local base ID=$base"
          lock=$(sha256sum deploy/images/vllm-rocm-0.33/requirements.lock | cut -d' ' -f1)
          docker run --rm --network none --entrypoint /usr/local/bin/tini -e "LOCK=$lock" -e "BASE_ID=$base" \
            -e "VERSION=$version" -e "PIN=$pin" warmctl-runtime-rocm:verify -- /bin/bash -ec '
              test "$(warmctl version)" = "warmctl $VERSION"
              grep -Fx "base=$BASE_ID" /opt/warmctl/RUNTIME
              grep -Fx "warmctl=$VERSION" /opt/warmctl/RUNTIME
              echo "$LOCK  /opt/vllm-rocm/requirements.lock" | sha256sum -c -
              python -c "import torch, torchvision, transformers, vllm; from importlib.metadata import version; assert version(\"vllm\") == \"0.33.0+rocm100\" and version(\"torch\") == \"2.13.0+rocm10.0.0\" and torch.version.hip"
              export KFDR_LIB="/opt/warmctl/kfdreplay/$PIN/libkfdreplay.so"
              python -c "import ctypes as c, os; f=c.CDLL(os.environ[\"KFDR_LIB\"]).kfdr_version; f.restype=c.c_char_p; assert f().decode() == os.environ[\"PIN\"][1:]"
              root=/opt/warmctl/dmtcp
              "$root/bin/dmtcp_coordinator" --daemon --exit-on-last --port 0 --port-file /tmp/dmtcp.port
              LD_PRELOAD="$KFDR_LIB" DMTCP_PLUGIN="$root/lib/libdmtcp_fdkeep.so" "$root/bin/dmtcp_launch" --join-coordinator --coord-port "$(cat /tmp/dmtcp.port)" /bin/true
            '

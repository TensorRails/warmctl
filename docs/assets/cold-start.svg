<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Where a cold start goes, and what warmctl restores instead</title>
  <desc id="desc">GLM-5.3-Flash FP8 on 8×H100. vLLM cold start 650 s: start processes, NCCL and build the model 15%, load weights 7%, compile kernels and capture CUDA graphs 39%, autotune GEMM kernels 17%, warm up 23%. warmctl restore 37.3 s: CRIU 11.7 s, GPU state 10.5 s, shared GPU memory 0.6 s, weights 13.6 s, canary 0.9 s.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#000"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#1f1f1f"/>

  <text x="56" y="62" class="mono" font-size="15" fill="#666">GLM-5.3-Flash · FP8 · MTP · TP8 on 8×H100 SXM · new replica → first token served</text>

  <!-- cold start: 650 s over 1168 px (1.797 px/s); the phase shares add to 101%, normalized -->
  <text x="56" y="114" class="sans" font-size="20" font-weight="600" fill="#ededed">vLLM cold start</text>
  <text x="1224" y="114" class="mono" font-size="20" fill="#a1a1a1" text-anchor="end">650 s</text>
  <g transform="translate(56 130)">
    <rect x="0"   width="171" height="34" rx="4" fill="#5b6577"/>
    <rect x="175" width="77"  height="34" rx="4" fill="#5f9fae"/>
    <rect x="256" width="447" height="34" rx="4" fill="#7aa7d9"/>
    <rect x="707" width="193" height="34" rx="4" fill="#a08fd6"/>
    <rect x="904" width="264" height="34" rx="4" fill="#6dbb9a" fill-opacity="0.45"/>
  </g>
  <g class="mono" font-size="13" fill="#a1a1a1">
    <text x="56"  y="188">processes, NCCL,</text><text x="56" y="205">build model 15%</text>
    <text x="231" y="188">weights</text><text x="231" y="205">7%</text>
    <text x="312" y="188">compile kernels, capture CUDA graphs</text><text x="312" y="205">39%</text>
    <text x="763" y="188">autotune GEMMs,</text><text x="763" y="205">967 shapes 17%</text>
    <text x="960" y="188">warm up, more graphs</text><text x="960" y="205">23%</text>
  </g>

  <!-- restore: 37.3 s at the same scale -->
  <text x="56" y="262" class="sans" font-size="20" font-weight="600" fill="#ededed">warmctl up</text>
  <text x="1224" y="262" class="mono" font-size="20" font-weight="700" fill="#6dbb9a" text-anchor="end">37.3 s</text>
  <rect x="56" y="278" width="67" height="34" rx="4" fill="#6dbb9a"/>
  <g class="mono" font-size="13" fill="#a1a1a1">
    <text x="140" y="292">CRIU 11.7 s · GPU state 10.5 s · shared GPU memory 0.6 s · weights 319.8 GiB 13.6 s · canary 0.9 s</text>
    <text x="140" y="310" fill="#666">same scale · nothing recompiled, no CUDA graph recaptured, no kernel re-tuned</text>
  </g>
</svg>

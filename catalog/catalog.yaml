# The models registry.warmctl.io/warmctl publishes: `make catalog-push`
# writes this list to warmctl/catalog:latest. Each name is a repository,
# warmctl/<name>, whose `latest` indexes one snapshot per platform.
#
# Check every license against the model card before publishing; `gated`
# makes `warmctl up` ask for --accept-license once per host.
models:
